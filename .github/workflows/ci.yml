name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type check frontend
        run: npm run typecheck --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Check generated frontend
        run: git diff --exit-code -- src/ifcx/static/viewer.js src/ifcx/static/viewer.bundle.js src/ifcx/static/viewer.bundle.js.map
      - name: Install development dependencies
        run: python -m pip install --editable ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: ty check
      - name: Test
        run: pytest -m "not integration"
      - name: Test VIKTOR IFC sample models
        run: pytest -m integration tests/test_sample_models.py
